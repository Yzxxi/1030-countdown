<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05070f" />
<meta name="description" content="刘佳糈，距离你落地南京还有多久。" />
<title>刘佳糈 · 距离你落地南京</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ffb98a' d='M12 21s-8-4.9-8-10.4A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 3.6C20 16.1 12 21 12 21z'/%3E%3C/svg%3E" />
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  :root{
    --ink:#f7f0e8;
    --dim:rgba(247,240,232,.62);
    --faint:rgba(247,240,232,.38);
    --line:rgba(255,255,255,.10);
    --warm:#ffcf9e;
    --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --num:Georgia,"Times New Roman","Songti SC",serif;
  }
  body{
    min-height:100vh;min-height:100svh;
    background:#05070f;color:var(--ink);
    font-family:var(--sans);
    display:flex;flex-direction:column;
    overflow-x:hidden;position:relative;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-3;
    background:
      radial-gradient(125% 78% at 50% 112%, rgba(255,164,104,.50) 0%, rgba(255,122,86,.17) 26%, rgba(20,10,40,0) 60%),
      radial-gradient(85% 55% at 80% 10%, rgba(126,146,255,.16) 0%, rgba(0,0,0,0) 62%),
      linear-gradient(180deg,#04060e 0%,#070c1c 24%,#0c1230 48%,#181533 70%,#281932 86%,#37202e 100%);
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(130% 100% at 50% 38%, rgba(0,0,0,0) 38%, rgba(0,0,0,.52) 100%);
  }
  #sky{position:fixed;inset:0;z-index:-2;width:100%;height:100%;display:block}

  main{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:clamp(1.6rem,7vh,4rem) 1.25rem clamp(1rem,3vh,2rem);
    text-align:center;position:relative;z-index:2;
    animation:rise 1.1s cubic-bezier(.2,.7,.25,1) .12s both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .eyebrow{
    margin:0 0 clamp(1.1rem,3.2vh,2rem);
    font-size:.7rem;letter-spacing:.34em;text-indent:.34em;
    color:var(--faint);font-weight:500;
    display:flex;align-items:center;justify-content:center;gap:.7rem;
  }
  .eyebrow::before,.eyebrow::after{
    content:"";width:1.6rem;height:1px;background:linear-gradient(90deg,transparent,rgba(255,207,158,.45));
  }
  .eyebrow::after{transform:scaleX(-1)}

  h1{
    margin:0 0 .55rem;
    font-family:var(--serif);font-weight:400;
    font-size:clamp(1.7rem,7.4vw,2.6rem);
    letter-spacing:.06em;text-indent:.06em;
    line-height:1.3;
  }
  .sub{
    margin:0 0 clamp(1.6rem,4.2vh,2.6rem);
    font-family:var(--serif);
    font-size:clamp(.82rem,3.4vw,.98rem);
    letter-spacing:.22em;text-indent:.22em;color:var(--dim);
  }

  .clock{
    display:flex;align-items:flex-start;justify-content:center;
    gap:clamp(.15rem,1.6vw,1.1rem);
    padding:clamp(.95rem,3.4vw,1.5rem) clamp(.7rem,3.6vw,1.9rem);
    border-radius:22px;
    background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.018));
    border:1px solid var(--line);
    box-shadow:0 34px 70px -34px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.09);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    backdrop-filter:blur(18px) saturate(140%);
    max-width:100%;
  }
  .cell{display:flex;flex-direction:column;align-items:center;gap:.45rem;min-width:clamp(3.1rem,16vw,4.6rem)}
  .cell b{
    display:block;
    font-family:var(--num);font-weight:400;
    font-size:clamp(2.05rem,10.4vw,3.9rem);line-height:1;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
    letter-spacing:-.01em;
    text-shadow:0 0 46px rgba(255,196,148,.30);
  }
  .cell i{
    font-style:normal;font-size:.66rem;letter-spacing:.24em;text-indent:.24em;
    color:var(--faint);
  }

  .meta{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center;margin:clamp(1.4rem,4vh,2.1rem) 0 0}
  .chip{
    font-size:.72rem;letter-spacing:.13em;
    padding:.38rem .8rem;border-radius:999px;
    border:1px solid rgba(255,255,255,.11);
    background:rgba(255,255,255,.028);
    color:rgba(247,240,232,.66);
    white-space:nowrap;
  }

  .quote{
    margin:clamp(1.6rem,4.6vh,2.6rem) auto 0;max-width:22rem;
    font-family:var(--serif);
    font-size:clamp(.88rem,3.5vw,1rem);
    line-height:2.1;letter-spacing:.05em;
    color:rgba(247,240,232,.55);
  }
  .quote span{color:rgba(255,207,158,.82)}

  /* arrived state */
  #arrived{display:none;flex-direction:column;align-items:center;text-align:center;padding:2rem 1rem}
  body.is-here #arrived{display:flex;animation:rise 1s cubic-bezier(.2,.7,.25,1) both}
  body.is-here #waiting{display:none}
  #arrived h2{
    margin:.2rem 0 .8rem;font-family:var(--serif);font-weight:400;
    font-size:clamp(2.4rem,13vw,4.4rem);letter-spacing:.1em;text-indent:.1em;
    background:linear-gradient(180deg,#fff6ea,#ffb98a);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 38px rgba(255,160,110,.35));
  }
  #arrived p{margin:.35rem 0;font-family:var(--serif);color:var(--dim);letter-spacing:.08em;font-size:clamp(.86rem,3.5vw,.98rem);line-height:2}

  .skyline{
    display:block;width:100%;height:clamp(92px,15vh,186px);
    position:relative;z-index:1;
    margin-top:auto;pointer-events:none;
    filter:drop-shadow(0 -18px 40px rgba(255,150,100,.10));
  }
  .heart{
    position:fixed;z-index:9;pointer-events:none;
    font-size:1rem;line-height:1;
    animation:floatUp 1.5s ease-out forwards;
    will-change:transform,opacity;
  }
  @keyframes floatUp{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
    18%{opacity:.95;transform:translate(-50%,-70%) scale(1.06)}
    100%{opacity:0;transform:translate(-50%,-260%) scale(.72)}
  }
  @media (prefers-reduced-motion:reduce){
    main{animation:none;opacity:1;transform:none}
    .heart{animation:none;display:none}
  }
  @media (max-height:560px){
    .quote{display:none}
    .sub{margin-bottom:1.2rem}
  }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>

<main>
  <div id="waiting">
    <p class="eyebrow">给&nbsp;刘佳糈</p>
    <h1>距离你落地南京</h1>
    <p class="sub">周五 · 还剩</p>

    <div class="clock" id="clock" aria-live="off">
      <div class="cell"><b id="dd">00</b><i>天</i></div>
      <div class="cell"><b id="hh">00</b><i>时</i></div>
      <div class="cell"><b id="mm">00</b><i>分</i></div>
      <div class="cell"><b id="ss">00</b><i>秒</i></div>
    </div>

    <div class="meta">
      <span class="chip">MU2970</span>
      <span class="chip">吉隆坡 T1 · 00:40</span>
      <span class="chip">禄口 T2 · 06:30</span>
    </div>

    <p class="quote">你在飞机上睡五个多小时，<br><span>我在南京数了三天。</span></p>
  </div>

  <div id="arrived">
    <p class="eyebrow">06 : 30 &nbsp;·&nbsp; 南京禄口</p>
    <h2>刘佳糈</h2>
    <p>你到了。</p>
    <p>行李转盘在楼下，慢慢来。<br>我在出口，花已经买好了。</p>
  </div>
</main>

<svg class="skyline" viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0c18"/>
      <stop offset="1" stop-color="#03050c"/>
    </linearGradient>
  </defs>
  <g fill="url(#g)">
    <!-- city wall -->
    <rect x="0" y="150" width="330" height="50"/>
    <rect x="10" y="140" width="26" height="12"/><rect x="52" y="140" width="26" height="12"/>
    <rect x="94" y="140" width="26" height="12"/><rect x="136" y="140" width="26" height="12"/>
    <rect x="178" y="140" width="26" height="12"/><rect x="220" y="140" width="26" height="12"/>
    <rect x="262" y="140" width="26" height="12"/><rect x="304" y="140" width="26" height="12"/>
    <!-- pagoda (Jiming Temple) -->
    <rect x="418" y="120" width="26" height="80"/>
    <polygon points="392,124 470,124 456,104 406,104"/>
    <polygon points="398,102 464,102 452,84 410,84"/>
    <polygon points="406,82 456,82 446,66 416,66"/>
    <rect x="426" y="46" width="8" height="20"/>
    <circle cx="430" cy="43" r="4"/>
    <!-- low blocks -->
    <rect x="500" y="168" width="52" height="32"/>
    <rect x="558" y="156" width="34" height="44"/>
    <rect x="598" y="174" width="48" height="26"/>
    <!-- Zifeng tower -->
    <polygon points="700,200 700,86 714,26 728,86 728,200"/>
    <rect x="712" y="10" width="4" height="20"/>
    <rect x="686" y="176" width="56" height="24"/>
    <!-- blocks -->
    <rect x="772" y="160" width="42" height="40"/>
    <rect x="820" y="172" width="38" height="28"/>
    <!-- TV tower -->
    <rect x="904" y="52" width="6" height="148"/>
    <rect x="894" y="118" width="26" height="5"/>
    <ellipse cx="907" cy="152" rx="24" ry="5"/>
    <rect x="901" y="36" width="12" height="16"/>
    <!-- far blocks -->
    <rect x="968" y="166" width="46" height="34"/>
    <rect x="1020" y="152" width="30" height="48"/>
    <rect x="1056" y="170" width="52" height="30"/>
    <rect x="1114" y="160" width="34" height="40"/>
    <rect x="1154" y="174" width="46" height="26"/>
  </g>
</svg>

<script>
(function () {
  "use strict";

  /* 2026-10-30 06:30 Asia/Shanghai == 2026-10-29 22:30 UTC */
  var TARGET = Date.UTC(2026, 9, 29, 22, 30, 0);

  var elD = document.getElementById("dd"),
      elH = document.getElementById("hh"),
      elM = document.getElementById("mm"),
      elS = document.getElementById("ss"),
      body = document.body;

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  var last = null;
  function tick() {
    var diff = TARGET - Date.now();

    if (diff <= 0) {
      if (!body.classList.contains("is-here")) {
        body.classList.add("is-here");
        document.title = "你到了 · 南京";
      }
      return;
    }

    var s = Math.floor(diff / 1000),
        d = Math.floor(s / 86400),
        h = Math.floor((s % 86400) / 3600),
        m = Math.floor((s % 3600) / 60),
        sec = s % 60;

    var key = d + ":" + h + ":" + m + ":" + sec;
    if (key === last) return;
    last = key;

    elD.textContent = pad(d);
    elH.textContent = pad(h);
    elM.textContent = pad(m);
    elS.textContent = pad(sec);
  }
  tick();
  setInterval(tick, 250);

  /* 点击/触摸飘心 */
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduced) {
    document.addEventListener("pointerdown", function (e) {
      var h = document.createElement("span");
      h.className = "heart";
      h.textContent = Math.random() < 0.22 ? "♥" : "♡";
      h.style.left = e.clientX + "px";
      h.style.top = e.clientY + "px";
      h.style.color = "rgba(255," + (170 + Math.floor(Math.random() * 60)) + ",150,.9)";
      h.style.fontSize = (12 + Math.random() * 14) + "px";
      document.body.appendChild(h);
      setTimeout(function () { h.remove(); }, 1600);
    }, { passive: true });
  }

  /* 星空 */
  var canvas = document.getElementById("sky");
  var ctx = canvas.getContext("2d");
  var stars = [], shooting = null, W = 0, H = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var n = Math.max(70, Math.round((W * H) / 8200));
    stars = [];
    for (var i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.76,
        r: 0.3 + Math.random() * 1.15,
        a: 0.22 + Math.random() * 0.55,
        p: Math.random() * Math.PI * 2,
        v: 0.35 + Math.random() * 0.9
      });
    }
    if (reduced) paint(0);
  }

  function paint(t) {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      var a = reduced ? st.a : st.a * (0.55 + 0.45 * Math.sin(t * 0.0012 * st.v + st.p));
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(226,232,255," + a.toFixed(3) + ")";
      ctx.fill();
    }
    if (shooting) {
      var pr = shooting.life / shooting.total;
      var x = shooting.x + (shooting.dx * (1 - pr));
      var y = shooting.y + (shooting.dy * (1 - pr));
      var grad = ctx.createLinearGradient(x, y, x + shooting.dx * 0.12, y + shooting.dy * 0.12);
      grad.addColorStop(0, "rgba(255,240,225," + (0.75 * pr).toFixed(3) + ")");
      grad.addColorStop(1, "rgba(255,240,225,0)");
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + shooting.dx * 0.16, y + shooting.dy * 0.16);
      ctx.stroke();
    }
  }

  function loop(t) {
    paint(t);
    if (shooting) {
      shooting.life -= 1;
      if (shooting.life <= 0) {
        shooting = null;
        scheduleShoot();
      }
    }
    requestAnimationFrame(loop);
  }

  function scheduleShoot() {
    if (reduced) return;
    setTimeout(function () {
      shooting = {
        x: W * (0.35 + Math.random() * 0.6),
        y: H * (0.03 + Math.random() * 0.22),
        dx: -(90 + Math.random() * 90),
        dy: 55 + Math.random() * 45,
        life: 46,
        total: 46
      };
    }, 6000 + Math.random() * 9000);
  }

  resize();
  window.addEventListener("resize", function () { resize(); if (reduced) paint(0); });
  if (!reduced) { requestAnimationFrame(loop); scheduleShoot(); }
})();
</script>
</body>
</html>
